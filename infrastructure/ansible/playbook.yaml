---
- name: Configure Web Server
  hosts: all
  become: true
  tasks:
    - name: Ping machine
      ping:

    - name: "Ubuntu Update"
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "Install nginx"
      apt:
        name: ["nginx"]
        state: latest

  handlers:
    - name: "Start Nginx"
      service:
        name: nginx
        state: started
        enabled: true